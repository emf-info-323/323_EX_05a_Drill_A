<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Exercice 5 - Drill A</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2em;
        }

        button {
            margin: 0.2em;
            padding: 0.5em 0.5em;
            font-size: 1em;
        }

        #output {
            margin-top: 2em;
            padding: 1em;
            font-family: 'Consolas', 'Courier New', Courier, monospace;
            font-size: 1em;
            font-weight: normal;
            border: 1px solid #ccc;
            min-height: 2em;
            background: #fafafa;
            color: darkgreen;
        }

        code {
            color: darkred;
        }
    </style>
    <script src="ex05-data-villes.js"></script>
    <script src="ex05-data-motos.js"></script>
    <script src="ex05-data-evaluations.js"></script>
    <script src="ex05.js"></script>
</head>

<body>
    <h1>Exercice 5 - Drill A</h1>
    <h3>Entraînement à <code>filter()</code></h3>
    <p>
        <button id="idActionF1">F1 - Les villes du canton de Fribourg(FR)</button>
        <button id="idActionF2">F2 - Les évaluations de Maths avec une note 6.0</button>
        <button id="idActionF3">F3 - Les villes ayant de 500 à 1000 habitants</button>
    </p>

    <h3>Entraînement à <code>map()</code></h3>
    <p>
        <button id="idActionM1">M1 - La liste des marques de moto</button>
        <button id="idActionM2">M2 - La liste des Prénom NOM des évalutions (avec doublons)</button>
        <button id="idActionM3">M3 - Toutes les villes et cantons (sans les habitants)</button>
    </p>

    <h3>Entraînement à <code>reduce()</code></h3>
    <p>
        <button id="idActionR1">R1 - La plus petite date d'évaluation</button>
        <button id="idActionR2">R2 - Pour chaque branche, le nombre d'évaluations réalisées</button>
        <button id="idActionR3">R3 - Pour chaque branche, le nombre de notes, leur moyenne à 2 décimales, la min et
            max</button>
    </p>

    <h3>Entraînement au chaînage</h3>
    <p>
        <button id="idActionC1">C1 - La liste des MARQUE / Modèle de motos</button>
        <button id="idActionC2">C2 - La liste des "NOM Prénom" des évalutions (sans doublons et triée)</button>
        <button id="idActionC3">C3 - Le prix moyen des motos de chaque marque</button>
        <button id="idActionC4">C4 - Pour chaque marque, la plus chère et la moins chère des motos</button>
        <button id="idActionC5">C5 - Pour CLAIRE Voyante, les branches et ses moyennes</button>
        <button id="idActionC6">C6 - { canton: population }, triée</button>
        <button id="idActionC7">C7 - [ { canton, population } ], triée</button>
        <button id="idActionC8">C8 - [ [ canton, population ] ], triée</button>
    </p>

    <pre id="output"></pre>
</body>

</html>
